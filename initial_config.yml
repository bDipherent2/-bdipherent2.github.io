    <script>
        // Simple interaction: Add a random subtle rotation on hover of the container
        const container = document.querySelector('.container');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            // Only apply on desktop
            if(window.innerWidth > 768) {
                // Very subtle tilt could go here, but let's keep it clean for performance
                // Instead, let's just subtly move the shapes based on mouse
                const shape1 = document.querySelector('.shape-1');
                const shape2 = document.querySelector('.shape-2');
                
                shape1.style.transform = `translate(${e.pageX * 0.02}px, ${e.pageY * 0.02}px)`;
                shape2.style.transform = `translate(${-e.pageX * 0.02}px, ${-e.pageY * 0.02}px)`;
            }
        });
    </script>
</body>
</html>


